<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HomeHQ">
<meta name="theme-color" content="#F2EEE7">
<title>HomeHQ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F2EEE7;--ink:#141414;--muted:#6B6560;--line:#E3DDD3;--card:#FFFFFF;
  --teal:#0E5E66;--sage:#DFEAD6;--sage-ink:#1F3A1A;--sage-2:#3D5A33;
  --note:#F6E7A6;--note-2:#5C5340;--danger:#B3261E;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;--serif:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121413;--ink:#ECE8E1;--muted:#9A948C;--line:#2A2D2B;--card:#1B1E1C;
  --teal:#63B5BD;--sage:#1E2A1B;--sage-ink:#D7E6CC;--sage-2:#9CC08C;--note:#3A3420;--note-2:#D9CD9C;
}}
:root[data-theme="dark"]{--ground:#121413;--ink:#ECE8E1;--muted:#9A948C;--line:#2A2D2B;--card:#1B1E1C;--teal:#63B5BD;--sage:#1E2A1B;--sage-ink:#D7E6CC;--sage-2:#9CC08C;--note:#3A3420;--note-2:#D9CD9C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans)}
body{min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{position:sticky;top:0;z-index:2;background:var(--ground);padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05}
.sub{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-top:4px;min-height:15px}
.tabs{display:flex;gap:8px;margin:14px 0 12px}
.tabs button{flex:1;height:42px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:800;letter-spacing:1px}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
main{flex:1;padding:0 16px calc(env(safe-area-inset-bottom) + 96px)}
.view{display:none}.view.on{display:block}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--sage-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.it .t{flex:1;min-width:0;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.it.done .chk{background:var(--sage-2)}.it.done .chk svg{opacity:1}
.it.done .t{text-decoration:line-through;color:var(--muted)}
.x{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;flex-shrink:0}
.sec{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip.in{background:var(--sage);border-color:var(--sage-2);color:var(--sage-ink)}
.chip.in::before{content:'✓';font-weight:800}
.chip .n{font-size:11px;font-weight:800;color:var(--muted)}
.chip.more{border-style:dashed;color:var(--muted)}
.sec button{font-size:13px;font-weight:800;color:var(--danger);letter-spacing:0;padding:8px 0}
.empty{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--muted);padding:28px 4px}
.note{background:var(--note);border:0;align-items:flex-start;padding:14px 8px 14px 16px}
.note .t{font-family:var(--serif);font-size:22px}
.note .meta{display:block;font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--note-2);margin-bottom:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--ground);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:17px}
.bar input:focus{outline:none;border-color:var(--teal)}
.add{width:50px;height:50px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.who{display:none;gap:6px}
.who button{width:40px;height:40px;border-radius:50%;font-size:14px;font-weight:800;color:#141414;opacity:.35;border:2px solid transparent}
.who button.sel{opacity:1;border-color:var(--ink)}
body.notes .who{display:flex}
.err{margin:40px 0;font-size:16px;line-height:1.5;color:var(--muted)}
:root{--pw:#3D7DAF;--pwb:#E3EEF6;--pa:#B4661F;--pab:#F7E9DB;--pg:#3E6B4F;--pgb:#E6EDE4;--pbad:#9C3B2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pw:#7DB3DE;--pwb:#142636;--pa:#E8A060;--pab:#33220F;--pg:#9CC08C;--pgb:#1A2418;--pbad:#E58A7C}}
body.plantes .bar{display:none}
.pl-top{display:flex;gap:8px;margin-bottom:12px}
.pl-top button{height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--muted)}
.pl-top button.on{border-color:var(--pg);background:var(--pgb);color:var(--pg)}
.pl{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.pl.due{border-color:var(--pa)}
.pl img,.pl .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--pgb)}
.pl .m{flex:1;min-width:0}
.pl .n{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.pl.due .s{color:var(--pa);font-weight:800}
.pw{height:44px;padding:0 14px;border-radius:12px;background:var(--pwb);color:var(--pw);font-size:14px;font-weight:800;flex-shrink:0}
.pl.due .pw{background:var(--pw);color:#fff}
.fab{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:3;height:54px;border-radius:16px;background:var(--pg);color:#fff;font-size:16px;font-weight:800;display:none;align-items:center;justify-content:center;gap:8px}
body.plantes .fab{display:flex}
.fab[disabled]{opacity:.6}
.sheet{position:fixed;inset:0;z-index:5;background:var(--ground);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);display:none}
.sheet.on{display:block}
.sh-x{float:right;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);font-size:22px;color:var(--muted)}
.sh-ph{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin:10px 0 12px;display:block}
.sh-n{font-family:var(--serif);font-size:32px;line-height:1.05;margin:4px 0 2px}
.sh-e{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted)}
.sh-st{font-size:14px;font-weight:700;margin:8px 0 12px;color:var(--muted)}
.sh-st.due{color:var(--pa)}
.btn-w{width:100%;height:52px;border-radius:14px;background:var(--pw);color:#fff;font-size:16px;font-weight:800;margin-bottom:10px}
.btn-2{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;font-weight:800;margin-bottom:10px}
.sec2{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted);margin:18px 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;display:flex;flex-direction:column;gap:10px}
.box b{display:block;font-size:12px;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--pw);color:var(--pw);font-size:22px;font-weight:700}
.step span{font-weight:800;min-width:110px;text-align:center}
.locs{display:flex;flex-wrap:wrap;gap:6px}
.locs button{height:38px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.locs button.sel{border-color:var(--pg);background:var(--pgb);color:var(--pg)}
.hi{border-top:1px solid var(--line);padding-top:8px}
.hi:first-child{border-top:0;padding-top:0}
.hi .d{font-size:12px;color:var(--muted)}
.hi .bon{color:var(--pg)}.hi .moyen{color:var(--pa)}.hi .mauvais{color:var(--pbad)}
.hi img{width:110px;border-radius:10px;margin-top:6px;display:block}
.hi ul{margin:4px 0 0;padding-left:18px}
.del{color:var(--danger);font-weight:800;font-size:14px;padding:16px 0}
.dz{width:100%;padding:28px 12px;border:1.5px dashed var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-size:15px;text-align:center}
textarea{width:100%;min-height:96px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;font-size:15px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hints button{padding:7px 10px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.res{margin-top:14px}
.busy{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800;text-align:center;padding:30px}
.busy.on{display:flex}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1 id="title">Courses</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs"><button class="on" data-tab="courses">COURSES</button><button data-tab="notes">NOTES</button><button data-tab="plantes">PLANTES</button></div>
</header>
<main>
  <section class="view on" id="v-courses"><ul id="open"></ul><div id="sugg"></div><div id="donewrap"></div></section>
  <section class="view" id="v-notes"><ul id="notes"></ul></section>
  <section class="view" id="v-plantes"><div class="pl-top"><button id="pl-season"></button><button id="pl-import">Importer une sauvegarde</button></div><ul id="plist"></ul></section>
</main>
<form class="bar" id="form" autocomplete="off">
  <div class="who" id="who"></div>
  <input id="inp" type="text" enterkeyhint="done" placeholder="Ajouter un article…" aria-label="Nouvel élément">
  <button class="add" type="submit" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</form>
<button class="fab" id="pl-add">+ Ajouter une plante (photo)</button>
<input type="file" id="f-add" accept="image/*" hidden>
<input type="file" id="f-diag" accept="image/*" hidden>
<input type="file" id="f-imp" accept=".txt,.json,text/plain,application/json" hidden>
<div class="sheet" id="sheet"></div>
<div class="busy" id="busy"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  var API = 'https://ufsrwglypwvuindxedoh.supabase.co/functions/v1/homehq';
  var PEOPLE = [{ nom: 'Ludo', c: '#A8D5E2' }, { nom: 'Loulou', c: '#F4B6C2' }];
  function $(id) { return document.getElementById(id); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // Clé d'accès : dans l'adresse (#k=…) au premier lien, puis mémorisée sur le téléphone
  var m = location.hash.match(/k=([a-f0-9]+)/), KEY = m ? m[1] : ls('hqk');
  if (m) ls('hqk', m[1]);

  var tab = ['notes', 'plantes'].indexOf(ls('tab')) >= 0 ? ls('tab') : 'courses';
  var me = ls('me') === '1' ? 1 : 0;
  var shop = [], notes = [], busy = 0;

  function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 1800); }
  function api(path, body) {
    var o = { cache: 'no-store' };
    if (body) { o.method = 'POST'; o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(body); }
    return fetch(API + path + '?k=' + KEY, o).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.erreur || r.status); return j; }); });
  }
  function stamp() { if (tab === 'plantes') return renderPlants(); var d = new Date(); $('sub').textContent = 'À JOUR · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function renderShop() {
    var open = shop.filter(function (x) { return !x.fait; }), done = shop.filter(function (x) { return x.fait; });
    $('open').innerHTML = open.length ? open.map(function (x) {
      return '<li class="it" data-id="' + x.id + '"><button class="chk" data-t="' + x.id + '" aria-label="Cocher">' + CHECK + '</button><span class="t" data-t="' + x.id + '">' + esc(x.texte) + '</span><button class="x" data-d="' + x.id + '" aria-label="Supprimer">×</button></li>';
    }).join('') : '<li class="empty">Rien à acheter pour l’instant.</li>';
    $('donewrap').innerHTML = done.length ? '<div class="sec"><span>DANS LE PANIER · ' + done.length + '</span><button data-clear>Retirer</button></div><ul>' + done.map(function (x) {
      return '<li class="it done"><button class="chk" data-t="' + x.id + '" aria-label="Décocher">' + CHECK + '</button><span class="t" data-t="' + x.id + '">' + esc(x.texte) + '</span><button class="x" data-d="' + x.id + '" aria-label="Supprimer">×</button></li>';
    }).join('') + '</ul>' : '';
    if (tab === 'courses') $('sub').dataset.n = open.length;
    renderSugg(open);
  }
  // Articles fréquents : les plus ajoutés d'abord (compteur serveur), puis une liste de base
  var BASE = ['Lait', 'Pain', 'Œufs', 'Beurre', 'Yaourts', 'Fromage râpé', 'Crème', 'Jambon', 'Poulet', 'Viande hachée', 'Saumon',
    'Pâtes', 'Riz', 'Farine', 'Sucre', 'Huile d’olive', 'Café', 'Thé', 'Tomates', 'Salade', 'Oignons', 'Ail', 'Pommes de terre',
    'Carottes', 'Courgettes', 'Pommes', 'Bananes', 'Citrons', 'Eau gazeuse', 'Papier toilette', 'Essuie-tout', 'Liquide vaisselle',
    'Lessive', 'Sacs poubelle'];
  var freq = [], suggAll = false;
  try { freq = JSON.parse(localStorage.getItem('hq_freq') || '[]'); } catch (e) {}
  function renderSugg(open) {
    var inList = {}, seen = {}, out = [];
    open.forEach(function (x) { inList[x.texte.trim().toLowerCase()] = x.id; });
    var push = function (t, n) { var k = t.trim().toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push({ t: t, n: n }); } };
    freq.forEach(function (f) { if (f.n >= 2) push(f.texte, f.n); });
    BASE.forEach(function (b) { push(b, 0); });
    freq.forEach(function (f) { if (f.n < 2) push(f.texte, f.n); });
    out = out.slice(0, 30);
    var vis = suggAll ? out : out.slice(0, 14);
    $('sugg').innerHTML = '<div class="sec"><span>FRÉQUENTS · TOUCHER POUR AJOUTER</span></div><div class="chips">' + vis.map(function (s) {
      var id = inList[s.t.trim().toLowerCase()], inl = id != null;
      return '<button class="chip' + (inl ? ' in' : '') + '" data-sg="' + esc(s.t) + '"' + (inl ? ' data-sgin="' + id + '"' : '') + '>' + esc(s.t) + (s.n >= 2 ? ' <span class="n">×' + s.n + '</span>' : '') + '</button>';
    }).join('') + (out.length > 14 ? '<button class="chip more" data-sgmore>' + (suggAll ? 'Moins' : '+ ' + (out.length - 14) + ' autres') + '</button>' : '') + '</div>';
  }
  function fmtWhen(s) {
    var d = new Date(s), t = new Date(), y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1);
    var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (d.toDateString() === t.toDateString()) return hm;
    if (d.toDateString() === y.toDateString()) return 'HIER ' + hm;
    return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + hm;
  }
  function renderNotes() {
    $('notes').innerHTML = notes.length ? notes.map(function (n) {
      return '<li class="it note"><span class="t"><span class="meta">' + esc(PEOPLE[n.auteur] ? PEOPLE[n.auteur].nom.toUpperCase() : '') + ' · ' + fmtWhen(n.created_at) + '</span>' + esc(n.texte) + '</span><button class="x" data-nd="' + n.id + '" aria-label="Supprimer">×</button></li>';
    }).join('') : '<li class="empty">Aucune note.</li>';
  }
  function renderWho() {
    $('who').innerHTML = PEOPLE.map(function (p, i) { return '<button type="button" data-me="' + i + '" class="' + (i === me ? 'sel' : '') + '" style="background:' + p.c + '" aria-label="' + p.nom + '">' + p.nom.charAt(0) + '</button>'; }).join('');
  }
  function setTab(t) {
    tab = t; ls('tab', t);
    document.body.classList.toggle('notes', t === 'notes');
    document.body.classList.toggle('plantes', t === 'plantes');
    $('title').textContent = t === 'notes' ? 'Notes' : t === 'plantes' ? 'Plantes' : 'Courses';
    $('v-plantes').classList.toggle('on', t === 'plantes');
    if (t === 'plantes') loadPlants();
    $('inp').placeholder = t === 'notes' ? 'Écrire une note…' : 'Ajouter un article…';
    [].forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    $('v-courses').classList.toggle('on', t === 'courses'); $('v-notes').classList.toggle('on', t === 'notes');
  }

  function loadAll() {
    if (busy) return;
    return Promise.all([api('/courses'), api('/notes')]).then(function (r) {
      if (busy) return;
      shop = r[0].courses || []; if (r[0].frequents) { freq = r[0].frequents; try { localStorage.setItem('hq_freq', JSON.stringify(freq)); } catch (e) {} } notes = r[1].notes || []; renderShop(); renderNotes(); stamp();
    }).catch(function () { $('sub').textContent = 'HORS LIGNE · NOUVEL ESSAI…'; });
  }
  function shopOp(body) {
    busy++;
    return api('/courses', body).then(function (d) { shop = d.courses || []; if (d.frequents) freq = d.frequents; }).catch(function () { toast('Pas de connexion, réessaie'); })
      .then(function () { busy--; renderShop(); stamp(); });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab],[data-t],[data-d],[data-clear],[data-nd],[data-me],[data-sg],[data-sgmore]'); if (!b) return;
    if (b.hasAttribute('data-sgmore')) { suggAll = !suggAll; return renderShop(); }
    if (b.hasAttribute('data-sg')) {
      if (b.hasAttribute('data-sgin')) { var si = +b.getAttribute('data-sgin'); shop = shop.filter(function (x) { return x.id !== si; }); renderShop(); return shopOp({ op: 'del', id: si }); }
      var sv = b.getAttribute('data-sg'); shop.push({ id: -Date.now(), texte: sv, fait: false }); renderShop();
      return shopOp({ op: 'add', texte: sv });
    }
    if (b.hasAttribute('data-tab')) return setTab(b.getAttribute('data-tab'));
    if (b.hasAttribute('data-me')) { me = +b.getAttribute('data-me'); ls('me', me); renderWho(); return; }
    if (b.hasAttribute('data-t')) {   // cocher : affichage immédiat, puis serveur
      var id = +b.getAttribute('data-t');
      shop.forEach(function (x) { if (x.id === id) x.fait = !x.fait; }); renderShop();
      return shopOp({ op: 'toggle', id: id });
    }
    if (b.hasAttribute('data-d')) { var di = +b.getAttribute('data-d'); shop = shop.filter(function (x) { return x.id !== di; }); renderShop(); return shopOp({ op: 'del', id: di }); }
    if (b.hasAttribute('data-clear')) { shop = shop.filter(function (x) { return !x.fait; }); renderShop(); return shopOp({ op: 'clear' }); }
    if (b.hasAttribute('data-nd')) {
      var ni = +b.getAttribute('data-nd'); notes = notes.filter(function (n) { return n.id !== ni; }); renderNotes();
      api('/notes', { op: 'del', id: ni }).then(function (d) { notes = d.notes || []; renderNotes(); }).catch(function () { toast('Pas de connexion, réessaie'); });
    }
  });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('inp').value.trim(); if (!v) return;
    $('inp').value = '';
    if (tab === 'courses') {
      shop.push({ id: -Date.now(), texte: v, fait: false }); renderShop();
      shopOp({ op: 'add', texte: v });
    } else {
      api('/notes', { op: 'add', texte: v, auteur: me }).then(function (d) { notes = d.notes || []; renderNotes(); })
        .catch(function () { $('inp').value = v; toast('Pas de connexion, réessaie'); });
    }
  });


  /* ---------- Plantes ---------- */
  var PL = { list: [], seasonal: true, open: null, t: null, diagFor: null, diagImg: null };
  var LIEUX = ['Rebord de fenêtre', 'Banc sous la fenêtre', 'Table basse', 'Loin de la fenêtre'];
  var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var HINTS = ['Feuilles jaunissent', 'Pointes brunes et sèches', 'Feuilles qui tombent', 'Taches sur les feuilles', 'Petits insectes visibles', 'Terreau constamment humide', 'Plante qui s’étiole'];
  function season() { var m = new Date().getMonth(); if (m >= 5 && m <= 7) return { f: 0.7, l: 'Plein été' }; if (m === 3 || m === 4 || m === 8) return { f: 0.85, l: 'Croissance' }; if (m === 2 || m === 9) return { f: 1, l: 'Intersaison' }; return { f: 1.4, l: 'Repos hivernal' }; }
  function pDays(p) { var b = p.care.arrosageJours || 7; return PL.seasonal ? Math.max(1, Math.round(b * season().f)) : b; }
  function pSt(p) {
    if (!p.lastWatered) return { due: true, left: 0, never: true };
    var left = Math.ceil((new Date(p.lastWatered).getTime() + pDays(p) * 86400000 - Date.now()) / 86400000);
    return { due: left <= 0, left: left };
  }
  function pTxt(st) { return st.never ? 'Jamais arrosée · à arroser' : st.due ? (st.left === 0 ? 'À arroser aujourd’hui' : 'En retard de ' + (-st.left) + ' j') : (st.left === 1 ? 'Arrosage demain' : 'Arrosage dans ' + st.left + ' j'); }
  function pImg(id) { return id ? API + '/plantes/photo?p=' + encodeURIComponent(id) + '&k=' + KEY : ''; }
  function pDate(iso) { var d = new Date(iso); return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear(); }
  function busyOn(t) { $('busy').textContent = t || ''; $('busy').classList.toggle('on', !!t); }
  function renderPlants() {
    var se = season();
    $('pl-season').className = PL.seasonal ? 'on' : '';
    $('pl-season').textContent = PL.seasonal ? se.l + ' ×' + String(se.f).replace('.', ',') : 'Saison : off';
    var list = PL.list.slice().sort(function (a, b) { var x = pSt(a), y = pSt(b); if (x.due !== y.due) return x.due ? -1 : 1; return x.left - y.left; });
    var due = list.filter(function (p) { return pSt(p).due; }).length;
    if (tab === 'plantes') $('sub').textContent = list.length + ' PLANTES · ' + (due ? due + ' À ARROSER' : 'TOUT EST ARROSÉ');
    $('plist').innerHTML = list.length ? list.map(function (p) {
      var st = pSt(p);
      return '<li class="pl' + (st.due ? ' due' : '') + '" data-po="' + p.id + '">' + (p.photo ? '<img src="' + pImg(p.photo) + '" alt="">' : '<span class="ph"></span>') +
        '<span class="m"><span class="n">' + esc(p.nomCommun) + '</span><span class="s">' + pTxt(st) + '</span></span><button class="pw" data-pw="' + p.id + '">Arrosé</button></li>';
    }).join('') : '<li class="empty">Aucune plante. Ajoute-en une avec une photo, ou importe ta sauvegarde.</li>';
    if (PL.open) renderSheet();
  }
  function renderSheet() {
    var p = PL.list.filter(function (x) { return x.id === PL.open; })[0];
    if (!p) { closeSheet(); return; }
    var st = pSt(p), c = p.care;
    var hist = (p.history || []).slice().reverse().map(function (h) {
      if (h.type !== 'diagnostic') return '<div class="hi"><span class="d">' + pDate(h.date) + '</span> · ' + (h.type === 'arrosage' ? 'Arrosage' : 'Plante ajoutée') + '</div>';
      var L = function (t, a) { return a && a.length ? '<b style="margin-top:6px">' + t + '</b><ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : ''; };
      return '<div class="hi"><span class="d">' + pDate(h.date) + '</span> · <strong class="' + esc(h.etat || '') + '">Diagnostic · état ' + esc(h.etat || '?') + '</strong>' +
        (h.photo ? '<img src="' + pImg(h.photo) + '" alt="">' : '') + (h.notes ? '<i>« ' + esc(h.notes) + ' »</i>' : '') +
        L('PROBLÈMES', h.problemes) + L('CAUSES PROBABLES', h.causes) + L('ACTIONS', h.actions) + '</div>';
    }).join('');
    $('sheet').innerHTML = '<button class="sh-x" data-sh="close" aria-label="Fermer">×</button>' +
      '<div class="sh-n">' + esc(p.nomCommun) + '</div><div class="sh-e">' + esc(p.espece || '') + (p.confiance != null ? ' · identification ' + p.confiance + ' %' : '') + '</div>' +
      (p.photo ? '<img class="sh-ph" src="' + pImg(p.photo) + '" alt="">' : '') +
      '<div class="sh-st' + (st.due ? ' due' : '') + '">' + pTxt(st) + (p.lastWatered ? ' · dernier le ' + pDate(p.lastWatered) : '') + '</div>' +
      '<button class="btn-w" data-pw="' + p.id + '">Arrosée maintenant</button>' +
      '<button class="btn-2" data-sh="diag">Diagnostic photo</button>' +
      '<div class="sec2">ENTRETIEN</div><div class="box">' +
      '<div><b>ARROSAGE</b><div class="step"><button data-sh="-1">−</button><span>tous les ' + c.arrosageJours + ' j</span><button data-sh="+1">+</button></div>' +
      (PL.seasonal ? '<span style="color:var(--pg);font-size:13px">' + season().l + ' : tous les ' + pDays(p) + ' jours</span>' : '') + '</div>' +
      '<div><b>EMPLACEMENT</b><div class="locs">' + LIEUX.map(function (l) { return '<button data-loc="' + l + '" class="' + (c.emplacement === l ? 'sel' : '') + '">' + l + '</button>'; }).join('') + '</div>' +
      (c.emplacementRaison ? '<span style="color:var(--muted);font-size:13px">' + esc(c.emplacementRaison) + '</span>' : '') + '</div>' +
      (c.lumiere ? '<div><b>LUMIÈRE</b>' + esc(c.lumiere) + '</div>' : '') + (c.engrais ? '<div><b>ENGRAIS</b>' + esc(c.engrais) + '</div>' : '') +
      (c.conseils && c.conseils.length ? '<div><b>CONSEILS</b>' + c.conseils.map(esc).join('<br>') + '</div>' : '') + '</div>' +
      '<div class="sec2">HISTORIQUE</div><div class="box">' + hist + '</div>' +
      '<button class="del" data-sh="del">Supprimer cette plante</button>';
  }
  function renderDiag(p, res) {
    var L = function (t, a) { return a && a.length ? '<b style="margin-top:6px">' + t + '</b><ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : ''; };
    $('sheet').innerHTML = '<button class="sh-x" data-sh="back" aria-label="Retour">×</button><div class="sh-n">Diagnostic</div><div class="sh-e">' + esc(p.nomCommun) + '</div>' +
      (res ? '<div class="box res"><strong class="' + esc(res.etat) + '" style="font-size:17px">État ' + esc(res.etat) + '</strong>' + L('PROBLÈMES OBSERVÉS', res.problemes) + L('CAUSES PROBABLES', res.causes) + L('ACTIONS RECOMMANDÉES', res.actions) + '</div><button class="btn-w" style="margin-top:14px" data-sh="back">Retour à la fiche</button>' :
      '<div style="margin:14px 0">' + (PL.diagImg ? '<img class="sh-ph" src="' + PL.diagImg.url + '" alt=""><button class="btn-2" data-sh="pick">Changer de photo</button>' : '<button class="dz" data-sh="pick">Choisir ou prendre une photo de la zone abîmée</button>') + '</div>' +
      '<div class="sec2">PRÉCISIONS (FACULTATIF)</div><textarea id="dnotes" placeholder="Depuis quand, changements récents, terreau, racines…"></textarea>' +
      '<div class="hints">' + HINTS.map(function (h) { return '<button data-hint="' + h + '">+ ' + h + '</button>'; }).join('') + '</div>' +
      '<button class="btn-w" style="margin-top:16px" data-sh="run"' + (PL.diagImg ? '' : ' disabled') + '>Lancer le diagnostic</button>');
  }
  function openSheet(id) { PL.open = id; renderSheet(); $('sheet').classList.add('on'); $('sheet').scrollTop = 0; }
  function closeSheet() { PL.open = null; $('sheet').classList.remove('on'); }
  function plApply(d) { PL.list = d.plantes || []; PL.seasonal = d.saisonnier !== false; renderPlants(); return d; }
  function loadPlants() { return api('/plantes').then(plApply).catch(function () {}); }
  function plOp(body, msg) {
    if (msg) busyOn(msg);
    return api('/plantes', body).then(plApply).catch(function (e) { toast('Échec : ' + (e.message || 'réseau')); loadPlants(); throw e; }).then(function (d) { busyOn(''); return d; }, function (e) { busyOn(''); throw e; });
  }
  // Photo -> JPEG réduit (base64)
  function shrink(file, max, q) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        var d = cv.toDataURL('image/jpeg', q); res({ url: d, b64: d.split(',')[1] });
      };
      img.onerror = rej; img.src = url;
    });
  }
  $('pl-season').addEventListener('click', function () { PL.seasonal = !PL.seasonal; renderPlants(); plOp({ op: 'seasonal', on: PL.seasonal }).catch(function () {}); });
  $('pl-add').addEventListener('click', function () { $('f-add').click(); });
  $('pl-import').addEventListener('click', function () { $('f-imp').click(); });
  $('f-add').addEventListener('change', function (e) {
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    shrink(f, 600, 0.72).then(function (im) { return plOp({ op: 'add', image: im.b64 }, 'Identification de la plante…'); })
      .then(function (d) { if (d && d.ajout) openSheet(d.ajout); }).catch(function () {});
  });
  $('f-imp').addEventListener('change', function (e) {
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var list; try { list = JSON.parse(String(r.result).trim()); } catch (x) { return toast('Fichier illisible'); }
      if (!Array.isArray(list)) return toast('Ce n’est pas une sauvegarde de plantes');
      plOp({ op: 'import', plantes: list }, 'Import de ' + list.length + ' plantes…').then(function (d) { toast((d.importees || 0) + ' plantes importées'); }).catch(function () {});
    };
    r.readAsText(f);
  });
  $('f-diag').addEventListener('change', function (e) {
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    var notes = $('dnotes') ? $('dnotes').value : '';
    Promise.all([shrink(f, 700, 0.75), shrink(f, 300, 0.6)]).then(function (r) {
      PL.diagImg = { url: r[0].url, b64: r[0].b64, thumb: r[1].b64 };
      renderDiag(PL.diagFor, null); $('dnotes').value = notes;
    });
  });
  $('plist').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pw],[data-po]'); if (!b) return;
    if (b.hasAttribute('data-pw')) { water(b.getAttribute('data-pw')); return; }
    openSheet(b.getAttribute('data-po'));
  });
  function water(id) {
    var now = new Date().toISOString();
    PL.list.forEach(function (p) { if (p.id === id) { p.lastWatered = now; p.history = (p.history || []).concat([{ type: 'arrosage', date: now }]); } });
    renderPlants(); toast('Arrosage noté');
    plOp({ op: 'water', id: id }).catch(function () {});
  }
  $('sheet').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sh],[data-pw],[data-loc],[data-hint]'); if (!b) return;
    var p = PL.list.filter(function (x) { return x.id === (PL.open || (PL.diagFor && PL.diagFor.id)); })[0];
    if (b.hasAttribute('data-pw')) return water(b.getAttribute('data-pw'));
    if (b.hasAttribute('data-hint')) { var t = $('dnotes'); t.value = t.value.trim() ? t.value.trim() + '. ' + b.getAttribute('data-hint') : b.getAttribute('data-hint'); return; }
    if (b.hasAttribute('data-loc') && p) { p.care.emplacement = b.getAttribute('data-loc'); renderSheet(); return plOp({ op: 'location', id: p.id, emplacement: p.care.emplacement }).catch(function () {}); }
    var v = b.getAttribute('data-sh');
    if (v === 'close') return closeSheet();
    if (v === '+1' || v === '-1') {
      p.care.arrosageJours = Math.max(1, Math.min(90, (p.care.arrosageJours || 7) + +v)); renderPlants();
      clearTimeout(PL.t); PL.t = setTimeout(function () { plOp({ op: 'interval', id: p.id, jours: p.care.arrosageJours }).catch(function () {}); }, 900);
      return;
    }
    if (v === 'diag') { PL.diagFor = p; PL.diagImg = null; PL.open = null; renderDiag(p, null); $('sheet').scrollTop = 0; return; }
    if (v === 'pick') return $('f-diag').click();
    if (v === 'back') { var id = PL.diagFor.id; PL.diagFor = null; openSheet(id); return; }
    if (v === 'run' && PL.diagImg) {
      var d = PL.diagFor;
      plOp({ op: 'diag', id: d.id, image: PL.diagImg.b64, thumb: PL.diagImg.thumb, notes: $('dnotes').value }, 'Analyse de la photo…')
        .then(function (r) { renderDiag(d, r.diagnostic); $('sheet').scrollTop = 0; }).catch(function () {});
      return;
    }
    if (v === 'del' && p) {
      if (b.dataset.ok) { closeSheet(); plOp({ op: 'delete', id: p.id }).catch(function () {}); }
      else { b.dataset.ok = '1'; b.textContent = 'Toucher encore pour confirmer la suppression'; }
    }
  });

  renderWho(); setTab(tab);
  if (!KEY) { $('v-courses').innerHTML = '<p class="err">Ouvre cette page avec le lien complet envoyé par Ludo (il contient la clé d’accès).</p>'; $('form').style.display = 'none'; return; }
  loadAll();
  setInterval(function () { if (!document.hidden) { loadAll(); if (tab === 'plantes') loadPlants(); } }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) loadAll(); });
})();
</script>
</body>
</html>
